# Dashboard service compose fragment. Included by the gateway's
# docker-compose.generated.yml when `dashboard` is enabled in config/services.yml.
#
# Caddy reverse-proxies to `dashboard:8003` over the project's default docker
# network — no public port bindings here.
#
# Phase 3 monitoring: the dashboard reads VPS metrics by stat-ing the host's
# /proc and /sys (mounted read-only at /host/proc and /host/sys), and reads
# per-service status / logs by talking to the docker engine via its UNIX
# socket (also mounted RO). No SSH key, no extra agent.
#
# `group_add` grants the non-root `dashboardsvc` user access to the docker
# socket. The GID has to match the host's `docker` group; verify with
# `getent group docker` on the VPS. On the Contabo image it's 988; on a
# fresh Debian/Ubuntu install it's typically 998 or 999. macOS Docker
# Desktop ignores it (the socket is owned by a different uid anyway).

services:
  dashboard:
    build:
      # Compose `include:` resolves relative paths in this fragment from the
      # fragment's own directory — so the build context is this directory.
      context: .
      dockerfile: Dockerfile
    image: rndexpart/dashboard:local
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      AUTH_INTERNAL_BASE_URL: ${AUTH_INTERNAL_BASE_URL:-http://auth:8001}
      DASHBOARD_HOST_PROC: /host/proc
      DASHBOARD_HOST_SYS: /host/sys
      DASHBOARD_DOCKER_PROJECT: ${DASHBOARD_DOCKER_PROJECT:-rndexpart}
      DASHBOARD_GH_REPO: ${DASHBOARD_GH_REPO:-rndexp-art/rndexpart}
      DASHBOARD_GH_PAT: ${GITHUB_PAT:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    group_add:
      - "988"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
