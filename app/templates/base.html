<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}dashboard · rndexp.art{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 1100px; margin: 24px auto; padding: 0 16px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 28px 0 10px; text-transform: uppercase; letter-spacing: .05em; color: #6b7280; }
    a { color: inherit; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .you { font-size: 12px; color: #6b7280; }
    nav.tabs { display: flex; gap: 2px; margin: 18px 0 24px; border-bottom: 1px solid rgba(127,127,127,.25); }
    nav.tabs a {
      padding: 8px 14px; text-decoration: none; border: 1px solid transparent;
      border-bottom: none; border-radius: 6px 6px 0 0; color: #6b7280;
    }
    nav.tabs a.active {
      color: inherit; border-color: rgba(127,127,127,.25);
      background: rgba(127,127,127,.06); margin-bottom: -1px;
    }
    .muted { color: #6b7280; font-size: 12px; }
    .card {
      border: 1px solid rgba(127,127,127,.22); border-radius: 8px;
      padding: 16px 18px; margin: 12px 0; background: rgba(127,127,127,.04);
    }
    .stub {
      border: 1px dashed rgba(127,127,127,.45); border-radius: 8px;
      padding: 18px 20px; color: #6b7280; background: rgba(127,127,127,.03);
    }
    .stub h3 { margin: 0 0 6px; color: inherit; font-size: 14px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(127,127,127,.18); vertical-align: top; }
    th { font-weight: 600; color: #6b7280; }
    button, input, select {
      font: inherit; padding: 5px 8px; border-radius: 6px;
      border: 1px solid rgba(127,127,127,.35); background: rgba(255,255,255,.04);
    }
    button { cursor: pointer; }
    .pill {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: rgba(127,127,127,.18); margin: 0 4px 4px 0; font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>rndexp.art dashboard</h1>
      <p class="muted">Admin console for users, VPS, services, and projects.</p>
    </div>
    <div class="you">
      Signed in as <strong>{{ me.email }}</strong>
      &nbsp;·&nbsp;
      <form action="https://auth.rndexp.art/logout" method="post" style="display:inline">
        <input type="hidden" name="target" value="https://dashboard.rndexp.art/" />
        <button type="submit">Sign out</button>
      </form>
    </div>
  </div>

  <nav class="tabs">
    <a href="/"         class="{% if active == 'index' %}active{% endif %}">Overview</a>
    <a href="/users"    class="{% if active == 'users' %}active{% endif %}">Users</a>
    <a href="/vps"      class="{% if active == 'vps' %}active{% endif %}">VPS</a>
    <a href="/services" class="{% if active == 'services' %}active{% endif %}">Services</a>
    <a href="/projects" class="{% if active == 'projects' %}active{% endif %}">Projects</a>
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
